navsat_transform:
  ros__parameters:
    frequency: 10.0
    delay: 3.0
    magnetic_declination_radians: -0.11082840750163991 #dongguan cipianjiao
    yaw_offset: -2.393169
    zero_altitude: true
    broadcast_cartesian_transform: true
    publish_filtered_gps: true
    use_odometry_yaw: true  # false 使用IMU的yaw做初始对齐

    wait_for_datum: false
 